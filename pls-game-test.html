<html lang="pl">
  <head>
    <meta charset="UTF-8" />

    <title>PL$ / audio tools</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap');

:root { --ink:#151515; --paper:#d6d5cf; --line:#8a8a85; --acid:#b6d8a6; --muted:#656560; }
* { box-sizing:border-box; }
html { background:var(--paper); }
body { margin:0; color:var(--ink); font-family:"DM Mono", monospace; font-size:12px; overflow-x:hidden; }
button, a { font:inherit; color:inherit; }
.desktop { min-height:100svh; position:relative; overflow:hidden; background-color:#bdbdb6; background-image:linear-gradient(rgba(206,206,198,.84),rgba(206,206,198,.84)),url("assets/pls-logo.png"); background-size:auto, 148px; background-repeat:repeat; }
.desktop::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.12; background-image:linear-gradient(rgba(21,21,21,.2) 1px, transparent 1px),linear-gradient(90deg,rgba(21,21,21,.2) 1px, transparent 1px); background-size:24px 24px; }
.topbar { height:64px; display:flex; align-items:center; gap:24px; padding:0 28px; border-bottom:1px solid var(--ink); position:relative; z-index:1; }
.wordmark { font-family:"Instrument Serif", Georgia, serif; font-size:31px; text-decoration:none; line-height:1; letter-spacing:-1px; }.wordmark span { color:#6c795f; }.topbar p { margin:0; color:var(--muted); font-size:10px; }.sound-toggle { margin-left:auto; background:none; border:0; cursor:pointer; padding:8px 0; color:var(--muted); }
.hero { width:max-content; max-width:85vw; margin:clamp(38px, 9vh, 85px) auto 0; text-align:center; position:relative; z-index:1; }.eyebrow { margin:0 0 15px; font-size:10px; letter-spacing:.06em; color:var(--muted); }.hero h1,.panel h2 { margin:0; font:normal clamp(48px, 7vw, 100px)/.86 "Instrument Serif", Georgia, serif; letter-spacing:-.055em; }.hero h1 { font-size:clamp(110px, 18vw, 240px); line-height:.67; text-shadow:4px 5px 0 rgba(245,245,241,.62); }.hero h1 span { color:#71876a; }.hero h1 small { display:inline-block; vertical-align:middle; margin-left:16px; font:normal clamp(13px,1.5vw,19px)/1 "DM Mono",monospace; letter-spacing:-.06em; color:var(--ink); text-shadow:none; }.intro { width:min(395px, 80vw); margin:35px auto 20px; line-height:1.55; }.status { display:flex; justify-content:center; gap:8px; align-items:center; color:var(--muted); font-size:10px; }.status i { display:block; width:7px; height:7px; background:#617858; border-radius:50%; }.status span { margin-left:14px; }
.folder-field { min-height:330px; position:relative; margin-top:10px; z-index:1; }.folder { position:absolute; border:0; padding:0; width:130px; height:126px; cursor:pointer; background:transparent; text-align:center; transition:transform .15s ease, filter .15s ease; filter:drop-shadow(2px 3px 0 rgba(21,21,21,.18)); }.folder:hover,.folder:focus-visible { transform:translate(-2px,-4px); filter:drop-shadow(5px 7px 0 rgba(21,21,21,.25)); outline:none; }.folder-icon { width:66px; height:47px; display:block; margin:8px auto 9px; padding-top:7px; color:#4d5c47; font-size:35px; line-height:24px; background:#b4b2aa; border:1px solid var(--ink); border-radius:2px; }.folder-icon::first-letter { color:#687a60; }.folder-body { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:5px; color:#121212; text-shadow:1px 1px #dddcd5; }.folder-body b { font-size:12px; font-weight:500; }.folder-body small { margin-top:5px; font-size:9px; color:#4c4c49; }.folder-plugin { left:12%; top:14px; }.folder-about { left:71%; top:20px; }.folder-tools { left:23%; top:176px; }.folder-contact { left:64%; top:168px; }.folder-plugin .folder-icon { background:var(--acid); }.folder-contact .folder-icon { background:#c4b8ad; }
.footer { min-height:50px; border-top:1px solid var(--ink); display:flex; align-items:center; justify-content:space-between; padding:0 28px; color:var(--muted); font-size:9px; position:relative; z-index:2; }.footer span:last-child { color:var(--ink); }
.panel { width:min(850px, calc(100vw - 34px)); max-height:min(740px, calc(100svh - 34px)); padding:0; color:var(--ink); background:#d5d5cf; border:1px solid var(--ink); box-shadow:10px 10px 0 rgba(21,21,21,.3); }.panel::backdrop { background:rgba(21,21,21,.64); backdrop-filter:blur(2px); }.panel-head { height:42px; display:flex; align-items:center; justify-content:space-between; padding:0 14px; border-bottom:1px solid var(--ink); background:var(--ink); color:#deddd8; }.panel-head p { margin:0; font-size:10px; }.close { border:0; color:inherit; background:none; cursor:pointer; padding:5px; }.panel-content { padding:clamp(24px, 5vw, 58px); overflow:auto; max-height:calc(100svh - 77px); background-image:linear-gradient(rgba(213,213,207,.91),rgba(213,213,207,.91)),url("assets/pls-logo-folders.png"); background-size:auto,180px; }.plugin-view { display:grid; grid-template-columns:1fr 1.3fr; gap:30px; }.plugin-title h2 { font-size:72px; }.plugin-title > p:last-child { margin-top:13px; color:var(--muted); }.plugin-image { border:1px solid var(--ink); background:#181818; align-self:start; }.plugin-image img { display:block; width:100%; opacity:.9; }.panel-copy { grid-column:1 / -1; max-width:530px; line-height:1.65; }.panel-copy ul { padding-left:17px; }.outline-button { grid-column:1 / -1; width:max-content; border:1px solid var(--ink); text-decoration:none; padding:12px 14px; transition:.15s; }.outline-button:hover { background:var(--ink); color:var(--paper); }.text-view { max-width:650px; }.text-view h2 { font-size:clamp(52px,7vw,90px); }.text-view > p:not(.eyebrow) { max-width:500px; line-height:1.7; margin-top:28px; }.tool-list { margin:35px 0; border-top:1px solid var(--line); }.tool-list p { display:flex; gap:16px; padding:14px 0; margin:0; border-bottom:1px solid var(--line); }.tool-list span { color:var(--muted); }.tool-list em { margin-left:auto; font-style:normal; font-size:10px; color:var(--muted); }.muted { color:var(--muted); font-size:10px; }.contact-view a { display:inline-block; margin-top:16px; font-family:"Instrument Serif", Georgia, serif; font-size:clamp(30px, 5vw, 55px); text-underline-offset:7px; }
@media (max-width:650px) { .topbar { padding:0 17px; }.topbar p { display:none; }.hero { margin-top:68px; }.hero h1 { font-size:36vw; }.hero h1 small { display:block; margin:18px 0 0; }.folder-field { min-height:400px; }.folder { width:130px; height:110px; }.folder-plugin { left:7%; top:34px; }.folder-about { left:58%; top:9px; }.folder-tools { left:10%; top:205px; }.folder-contact { left:56%; top:214px; }.footer { padding:12px 17px; line-height:1.4; }.footer span:nth-child(2) { display:none; }.plugin-view { grid-template-columns:1fr; gap:22px; }.panel-copy { grid-column:auto; }.outline-button { grid-column:auto; } }

.about-view h2 { line-height:.78; }
.about-view h2 small { display:block; max-width:285px; margin:18px 0 0 4px; font:normal 12px/1.25 "DM Mono", monospace; letter-spacing:-.04em; color:var(--muted); }
.hero .eyebrow { margin-bottom:29px; }
.beta-form { grid-column:1 / -1; width:min(100%, 430px); }.beta-form label { display:block; margin-bottom:10px; font-size:13px; }.beta-form label span { display:block; margin-top:7px; color:var(--muted); font-size:10px; }.beta-form div { display:flex; }.beta-form input { min-width:0; flex:1; padding:12px; color:var(--ink); background:rgba(235,235,230,.8); border:1px solid var(--ink); border-radius:0; font:inherit; }.beta-form button { padding:0 18px; color:var(--paper); background:var(--ink); border:1px solid var(--ink); cursor:pointer; }.beta-form button:disabled { cursor:wait; opacity:.55; }.form-status { min-height:16px; margin:9px 0 0; color:var(--muted); font-size:10px; }.contact-view a { display:block; width:max-content; max-width:100%; }.contact-view a + a { margin-top:15px; font-size:clamp(17px, 3vw, 31px); }

/* ===== ANIMATIONS (dodane) ===== */

/* Folder Store position */
.folder-store { left:45%; top:90px; }
.folder-store .folder-icon { background:#d4a574; }

/* Entrance animations */
@keyframes fadeInUp {
 from { opacity:0; transform:translateY(16px); }
 to { opacity:1; transform:translateY(0); }
}

@keyframes folderPop {
 from { opacity:0; transform:translateY(20px) scale(.92); }
 to { opacity:1; transform:translateY(0) scale(1); }
}

@keyframes slideDown {
 from { opacity:0; transform:translateY(-12px); }
 to { opacity:1; transform:translateY(0); }
}

@keyframes pulse {
 0%, 100% { transform:scale(1); opacity:1; }
 50% { transform:scale(1.35); opacity:.55; }
}

/* Apply entrance animations */
.topbar { animation:slideDown .5s ease both; }
.hero .eyebrow { animation:fadeInUp .6s .15s ease both; }
.hero h1 { animation:fadeInUp .7s .25s ease both; }
.hero .intro { animation:fadeInUp .6s .4s ease both; }
.hero .status { animation:fadeInUp .5s .55s ease both; }
.footer { animation:fadeInUp .5s .7s ease both; }

.folder { opacity:0; animation:folderPop .45s cubic-bezier(.34,1.56,.64,1) forwards; }
.folder-plugin { animation-delay:.3s; }
.folder-about { animation-delay:.4s; }
.folder-tools { animation-delay:.5s; }
.folder-store { animation-delay:.55s; }
.folder-contact { animation-delay:.6s; }

.status i { animation:pulse 2.2s ease-in-out infinite; }

/* Panel open/close animation */
.panel {
 opacity:0;
 transform:scale(.94) translateY(12px);
 transition:opacity .3s ease, transform .3s ease, overlay .3s;
}
.panel[open] {
 opacity:1;
 transform:scale(1) translateY(0);
}
.panel::backdrop {
 opacity:0;
 transition:opacity .3s ease;
}
.panel[open]::backdrop { opacity:1; }

/* Panel content entrance */
.panel-content > * {
 opacity:0;
 transform:translateY(10px);
 animation:fadeInUp .4s .1s ease both;
}

/* Folder hover enhancement */
.folder:hover .folder-icon { transform:rotate(-2deg); transition:transform .2s ease; }

/* Tool list hover */
.tool-list p { transition:padding-left .2s ease, background .2s ease; }
.tool-list p:hover { padding-left:6px; background:rgba(21,21,21,.025); }

/* Contact links hover */
.contact-view a { transition:color .2s ease, transform .2s ease; }
.contact-view a:hover { transform:translateX(3px); }

/* Outline button hover */
.outline-button { position:relative; overflow:hidden; transition:color .2s ease; }
.outline-button::before {
 content:"";
 position:absolute;
 inset:0;
 background:var(--ink);
 transform:translateX(-101%);
 transition:transform .25s cubic-bezier(.22,1,.36,1);
 z-index:-1;
}
.outline-button:hover { color:var(--paper); background:transparent; }
.outline-button:hover::before { transform:translateX(0); }

/* Beta form focus */
.beta-form input { transition:background .2s ease, box-shadow .2s ease; }
.beta-form input:focus { outline:none; background:#fff; box-shadow:3px 3px 0 rgba(21,21,21,.12); }
.beta-form button { transition:background .2s ease, transform .1s ease; }
.beta-form button:hover { background:#2a2a2a; }
.beta-form button:active { transform:translateY(1px); }

/* Toast notification */
.toast {
 position:fixed;
 bottom:20px;
 right:20px;
 padding:10px 16px;
 background:var(--ink);
 color:var(--paper);
 font-size:11px;
 border:1px solid var(--ink);
 box-shadow:5px 5px 0 rgba(21,21,21,.2);
 z-index:1000;
 opacity:0;
 transform:translateY(16px);
 transition:opacity .35s ease, transform .35s cubic-bezier(.22,1,.36,1);
 pointer-events:none;
}
.toast.show { opacity:1; transform:translateY(0); pointer-events:auto; }

/* Scrollbar */
.panel-content::-webkit-scrollbar { width:5px; }
.panel-content::-webkit-scrollbar-track { background:transparent; }
.panel-content::-webkit-scrollbar-thumb { background:var(--line); border-radius:2px; }

/* Responsive store position */
@media (max-width:650px) {
 .folder-store { left:50%; top:120px; margin-left:-65px; }
}

/* Reduced motion */
@media (prefers-reduced-motion:reduce) {
 * { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

/* ===== NEWSLETTER & COUNTER (added) ===== */
.waitlist-count {
 text-align: center;
 margin-top: 10px;
 font-size: 10px;
 color: var(--muted);
 letter-spacing: 0.04em;
 opacity: 0;
 animation: fadeInUp 0.5s 0.8s ease both;
}
.waitlist-count .beta-count {
 color: var(--ink);
 font-weight: 500;
}

/* ===== NOW PLAYING / STATUS ===== */
.now-playing { margin-top: 40px; text-align: center; opacity: 0; animation: fadeInUp 0.6s 0.35s ease both; }
.now-label { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.now-line { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border: 1px solid var(--ink); background: rgba(21,21,21,0.04); font-size: 11px; }
.now-dot { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.now-dot.online { background: #617858; animation: pulse 2.2s ease-in-out infinite; }
.now-dot.offline { background: #8a8a85; }
.now-icon { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; flex-shrink: 0; }
.now-icon svg { width: 100%; height: 100%; fill: var(--ink); }
.now-text { color: var(--ink); }

/* ===== FOLDER PARTICLES ($ / PL) ===== */
.folder-particle {
 position: absolute;
 pointer-events: none;
 font-family: "Instrument Serif", Georgia, serif;
 font-weight: 700;
 color: var(--ink);
 opacity: 0;
 z-index: 100;
 text-shadow: 0 0 3px rgba(245,245,241,0.35);
 letter-spacing: -0.02em;
}

@keyframes particleFloatPL {
 0% { opacity: 0; transform: translateY(0) scale(0.35) rotate(-12deg); }
 18% { opacity: 0.9; transform: translateY(-18px) scale(1.08) rotate(6deg); }
 100% { opacity: 0; transform: translateY(-110px) scale(0.45) rotate(22deg); }
}

@keyframes particleFloatDollar {
 0% { opacity: 0; transform: translateY(0) scale(0.35) rotate(12deg); }
 18% { opacity: 0.9; transform: translateY(-22px) scale(1.12) rotate(-6deg); }
 100% { opacity: 0; transform: translateY(-95px) scale(0.55) rotate(-18deg); }
}

/* ===== PLUGIN CAROUSEL ===== */
.plugin-carousel {
 grid-column: 1 / -1;
 width: 100%;
 max-width: 100%;
 border: 1px solid var(--ink);
 background: #181818;
 overflow: hidden;
 position: relative;
 user-select: none;
}

.carousel-track {
 display: flex;
 width: 100%;
 transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
 cursor: grab;
 will-change: transform;
}

.carousel-track:active {
 cursor: grabbing;
}

.carousel-slide {
 flex: 0 0 100%;
 width: 100%;
 max-width: 100%;
 display: flex;
 align-items: center;
 justify-content: center;
 background: #151515;
 opacity: 0;
 animation: slideReveal 0.5s ease forwards;
 overflow: hidden;
}
.carousel-slide:nth-child(1) { animation-delay: 0.05s; }
.carousel-slide:nth-child(2) { animation-delay: 0.1s; }
.carousel-slide:nth-child(3) { animation-delay: 0.15s; }
.carousel-slide:nth-child(4) { animation-delay: 0.2s; }

.carousel-slide img {
 display: block;
 max-width: 100%;
 max-height: 55vh;
 width: auto;
 height: auto;
 object-fit: contain;
 opacity: 0.88;
 transition: opacity 0.3s, transform 0.5s;
}

.carousel-slide.active img {
 opacity: 1;
 transform: scale(1.015);
}

@keyframes slideReveal {
 from { opacity: 0; transform: scale(0.96); }
 to { opacity: 1; transform: scale(1); }
}

.carousel-nav {
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: 10px 16px;
 background: var(--paper);
 border-top: 1px solid var(--ink);
}

.carousel-prev,
.carousel-next {
 background: none;
 border: 1px solid var(--ink);
 color: var(--ink);
 padding: 5px 14px;
 cursor: pointer;
 font-family: inherit;
 font-size: 13px;
 transition: all 0.15s ease;
}

.carousel-prev:hover,
.carousel-next:hover {
 background: var(--ink);
 color: var(--paper);
}

.carousel-dots {
 display: flex;
 gap: 7px;
}

.carousel-dot {
 width: 7px;
 height: 7px;
 border-radius: 50%;
 background: var(--line);
 border: none;
 cursor: pointer;
 padding: 0;
 transition: transform 0.2s, background 0.2s;
}

.carousel-dot.active {
 background: var(--ink);
 transform: scale(1.25);
}

/* Responsive carousel */
@media (max-width: 650px) {
 .plugin-view { grid-template-columns: 1fr; gap: 18px; }
}

/* ===== GAME FOLDER ===== */
.folder-game { left:38%; top:90px; }
.folder-game .folder-icon { background:#c9b8d4; }

/* ===== GAME VIEW ===== */
.game-view { max-width: 100%; }
.game-header { text-align: center; margin-bottom: 18px; }
.game-header h2 { font-size: clamp(42px, 7vw, 72px); margin: 0; }
.game-header p { color: var(--muted); margin-top: 8px; }

.game-container {
 position: relative;
 width: 100%;
 max-width: 640px;
 margin: 0 auto;
 border: 1px solid var(--ink);
 background: #0d0d12;
 overflow: hidden;
 image-rendering: pixelated;
}

#game-canvas {
 display: block;
 width: 100%;
 height: auto;
 image-rendering: pixelated;
}

.game-ui {
 position: absolute;
 inset: 0;
 pointer-events: none;
}

.game-stats {
 position: absolute;
 top: 10px;
 left: 14px;
 right: 14px;
 display: flex;
 justify-content: space-between;
 font-family: "DM Mono", monospace;
 font-size: 14px;
 color: #e8e6df;
 text-shadow: 1px 1px 0 #000;
 z-index: 5;
}

.game-overlay {
 position: absolute;
 inset: 0;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 gap: 14px;
 background: rgba(13,13,18,0.82);
 pointer-events: auto;
 z-index: 10;
 transition: opacity 0.3s;
}
.game-overlay.hidden { opacity: 0; pointer-events: none; }
.game-overlay p { color: #e8e6df; font-size: 13px; letter-spacing: 0.06em; margin: 0; }
.game-overlay p:first-child { font-family: "Instrument Serif", Georgia, serif; font-size: 28px; }

.game-mobile-controls {
 display: none;
 justify-content: space-between;
 padding: 10px 20px;
 background: var(--paper);
 border-top: 1px solid var(--ink);
}
.game-mobile-controls button {
 background: none;
 border: 1px solid var(--ink);
 color: var(--ink);
 padding: 12px 28px;
 font-size: 18px;
 cursor: pointer;
 touch-action: manipulation;
}
.game-mobile-controls button:active {
 background: var(--ink);
 color: var(--paper);
}

.game-info {
 margin-top: 18px;
 text-align: center;
}
.game-info ul {
 list-style: none;
 padding: 0;
 display: inline-flex;
 flex-wrap: wrap;
 gap: 10px 24px;
 justify-content: center;
}
.game-info li {
 font-size: 11px;
 color: var(--muted);
}
.item-icon {
 display: inline-block;
 font-weight: 700;
 color: var(--ink);
}

/* ===== CHARACTER SELECT (added) ===== */
.char-select {
 display: flex;
 gap: 20px;
 justify-content: center;
 align-items: center;
}

.char-btn {
 display: flex;
 flex-direction: column;
 align-items: center;
 gap: 10px;
 padding: 14px 18px;
 background: transparent;
 border: 1px solid var(--ink);
 cursor: pointer;
 transition: transform 0.15s ease, background 0.15s ease;
 color: #e8e6df;
}

.char-btn:hover {
 transform: translateY(-3px);
 background: rgba(255,255,255,0.06);
}

.char-btn:active {
 transform: translateY(0);
}

.char-preview {
 width: 44px;
 height: 44px;
 image-rendering: pixelated;
 position: relative;
}

/* Male preview - pixel art mini */
.male-preview {
 background: #d4a574;
 box-shadow:
   inset 0 -6px 0 #b0865a,
   inset 0 -10px 0 #1a1a1a,
   inset 0 -14px 0 #ffd700,
   0 -8px 0 #e85d3e,
   -4px 4px 0 #1a1a1a,
   4px 4px 0 #1a1a1a;
}
.male-preview::before {
 content: "";
 position: absolute;
 top: 10px;
 left: 8px;
 width: 28px;
 height: 8px;
 background: #0a0a0a;
 box-shadow: 0 -2px 0 #ffd700, 0 2px 0 #ffd700;
}

/* Anime preview - pixel art mini */
.anime-preview {
 background: #ffe0d0;
 border-radius: 50% 50% 45% 45%;
 box-shadow:
   inset -6px 0 0 #ffb7d5,
   inset 6px 0 0 #ffb7d5,
   0 -10px 0 #ffb7d5,
   -10px -4px 0 #ffb7d5,
   10px -4px 0 #ffb7d5;
}
.anime-preview::before {
 content: "";
 position: absolute;
 top: 14px;
 left: 10px;
 width: 6px;
 height: 6px;
 background: #44aaff;
 border-radius: 50%;
 box-shadow: 18px 0 0 #44aaff;
}
.anime-preview::after {
 content: "";
 position: absolute;
 top: 10px;
 left: 6px;
 width: 4px;
 height: 4px;
 background: #ff5588;
 border-radius: 50%;
 box-shadow: 28px 0 0 #ff5588;
}

.char-name {
 font-size: 11px;
 letter-spacing: 0.04em;
 color: #e8e6df;
}

/* Responsive game */
@media (max-width: 650px) {
 .folder-game { left: 50%; top: 105px; margin-left: -65px; }
 .game-mobile-controls { display: flex; }
 .game-info ul { flex-direction: column; gap: 6px; }
 .char-select { gap: 12px; }
 .char-btn { padding: 10px 12px; }
 .char-preview { width: 36px; height: 36px; }
}

/* ===== GAME LIVES ===== */
#game-lives {
  color: #e85d5d;
  font-size: 16px;
  letter-spacing: 2px;
}

/* ===== OVERTIME OVERLAY ===== */
#game-overtime {
  background: rgba(13,13,18,0.92);

/* ===== PLUGIN CAROUSEL ===== */
function initCarousel() {
 const carousel = document.getElementById('plugin-carousel');
 if (!carousel) return;

 const track = carousel.querySelector('.carousel-track');
 const slides = carousel.querySelectorAll('.carousel-slide');
 const dotsContainer = carousel.querySelector('.carousel-dots');
 const prevBtn = carousel.querySelector('.carousel-prev');
 const nextBtn = carousel.querySelector('.carousel-next');

 if (!slides.length) return;

 let current = 0;
 let isDragging = false;
 let startX = 0;

 slides.forEach((_, i) => {
 const dot = document.createElement('button');
 dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
 dot.type = 'button';
 dot.ariaLabel = 'Slide ' + (i + 1);
 dot.addEventListener('click', () => goTo(i));
 dotsContainer.appendChild(dot);
 });

 const dots = dotsContainer.querySelectorAll('.carousel-dot');

 function updateSlides() {
 slides.forEach((s, i) => s.classList.toggle('active', i === current));
 dots.forEach((d, i) => d.classList.toggle('active', i === current));
 }

 function goTo(index) {
 if (index < 0) index = slides.length - 1;
 if (index >= slides.length) index = 0;
 current = index;
 track.style.transform = `translateX(-${current * 100}%)`;
 updateSlides();
 }

 prevBtn.addEventListener('click', () => goTo(current - 1));
 nextBtn.addEventListener('click', () => goTo(current + 1));

 // Mouse drag
 track.addEventListener('mousedown', (e) => {
 isDragging = true;
 startX = e.pageX;
 track.style.transition = 'none';
 track.style.cursor = 'grabbing';
 });

 window.addEventListener('mousemove', (e) => {
 if (!isDragging) return;
 const walk = e.pageX - startX;
 const percent = (walk / carousel.offsetWidth) * 100;
 track.style.transform = `translateX(calc(-${current * 100}% + ${percent}%))`;
 });

 window.addEventListener('mouseup', (e) => {
 if (!isDragging) return;
 isDragging = false;
 track.style.transition = 'transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)';
 track.style.cursor = 'grab';
 const walk = e.pageX - startX;
 const threshold = carousel.offsetWidth * 0.18;
 if (walk < -threshold) goTo(current + 1);
 else if (walk > threshold) goTo(current - 1);
 else goTo(current);
 });

 // Touch drag
 track.addEventListener('touchstart', (e) => {
 isDragging = true;
 startX = e.touches[0].pageX;
 track.style.transition = 'none';
 }, { passive: true });

 track.addEventListener('touchmove', (e) => {
 if (!isDragging) return;
 const walk = e.touches[0].pageX - startX;
 const percent = (walk / carousel.offsetWidth) * 100;
 track.style.transform = `translateX(calc(-${current * 100}% + ${percent}%))`;
 }, { passive: true });

 track.addEventListener('touchend', (e) => {
 if (!isDragging) return;
 isDragging = false;
 track.style.transition = 'transform 0.55s cubic-bezier(0.22, 1, 0.36, 1)';
 const walk = e.changedTouches[0].pageX - startX;
 const threshold = carousel.offsetWidth * 0.18;
 if (walk < -threshold) goTo(current + 1);
 else if (walk > threshold) goTo(current - 1);
 else goTo(current);
 });

 updateSlides();
}

/* ===== AUDIO ===== */
function initAudio() {
 if (!audioCtx) {
 try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
 }
}

function playPickupSound(type) {
 if (!audioCtx || volSfx <= 0) return;
 try {
 const osc = audioCtx.createOscillator();
 const gain = audioCtx.createGain();
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 const freqs = { '$': 520, 'PL': 580, 'spk': 720, 'mic': 880, 'dia': 1100 };
 const key = type === '\uD83D\uDD0A' ? 'spk' : type === '\uD83C\uDFA4' ? 'mic' : type === '\uD83D\uDC8E' ? 'dia' : type;
 osc.frequency.value = freqs[key] || 600;
 osc.type = key === 'dia' ? 'square' : 'sine';
 gain.gain.setValueAtTime(volSfx * 0.12, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
 osc.start(audioCtx.currentTime);
 osc.stop(audioCtx.currentTime + 0.12);
 } catch(e) {}
}

function playLifeLostSound() {
 if (!audioCtx || volSfx <= 0) return;
 try {
 const osc = audioCtx.createOscillator();
 const gain = audioCtx.createGain();
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.frequency.setValueAtTime(300, audioCtx.currentTime);
 osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
 osc.type = 'sawtooth';
 gain.gain.setValueAtTime(volSfx * 0.15, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
 osc.start(audioCtx.currentTime);
 osc.stop(audioCtx.currentTime + 0.3);
 } catch(e) {}
}

function playOvertimeSound() {
 if (!audioCtx || volSfx <= 0) return;
 try {
 for (let i = 0; i < 3; i++) {
 const osc = audioCtx.createOscillator();
 const gain = audioCtx.createGain();
 osc.connect(gain);
 gain.connect(audioCtx.destination);
 osc.frequency.value = 440 + i * 110;
 osc.type = 'square';
 gain.gain.setValueAtTime(volSfx * 0.08, audioCtx.currentTime + i * 0.1);
 gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.2);
 osc.start(audioCtx.currentTime + i * 0.1);
 osc.stop(audioCtx.currentTime + i * 0.1 + 0.2);
 }
 } catch(e) {}
}

function setMusicVolume(v) {
 volMusic = v;

 if (gameMusic) gameMusic.volume = v;
}

function setSfxVolume(v) {
 volSfx = v;
}

function startMusic(track) {
 if (menuMusic) { menuMusic.pause(); menuMusic.currentTime = 0; }
 if (gameMusic) { gameMusic.pause(); gameMusic.currentTime = 0; }
 if (track === 'menu') {

 } else if (track === 'male') {

 } else if (track === 'anime') {
 gameMusic = document.getElementById('audio-anime');
 if (gameMusic) { gameMusic.volume = volMusic; gameMusic.play().catch(()=>{}); }
 }
}

 // Palettes for smooth sky cycle

 ];

 function lerp(a, b, t) { return a + (b - a) * t; }
 function lerpColor(c1, c2, t) {
 return [Math.round(lerp(c1[0], c2[0], t)), Math.round(lerp(c1[1], c2[1], t)), Math.round(lerp(c1[2], c2[2], t))];
 }

 function getCurrentPalette() {
 const phase = (bgCycle * 4) % 4;
 const idx = Math.floor(phase);
 const next = (idx + 1) % 4;
 const t = phase - idx;
 const p1 = palettes[idx], p2 = palettes[next];
 return {
 top: lerpColor(p1.top, p2.top, t),
 bot: lerpColor(p1.bot, p2.bot, t),
 starA: lerp(p1.starA, p2.starA, t),
 sun: p1.sun || (t > 0.5 && p2.sun),
 moon: p1.moon && t < 0.5,
 win: t < 0.5 ? p1.win : p2.win,
 phase: idx
 };
 }

 function drawPixelRect(x, y, w, h, color) {
 ctx.fillStyle = color;
 ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
 }

 function drawSky() {
 const pal = getCurrentPalette();
 // Smooth pixel sky
 for (let y = 0; y < H; y += 2) {
 const t = y / H;
 const r = Math.round(pal.top[0] + t * (pal.bot[0] - pal.top[0]));
 const g = Math.round(pal.top[1] + t * (pal.bot[1] - pal.top[1]));
 const b = Math.round(pal.top[2] + t * (pal.bot[2] - pal.top[2]));
 drawPixelRect(0, y, W, 2, `rgb(${r},${g},${b})`);
 }

 // Stars with twinkle
 if (pal.starA > 0.05) {
 for (let i = 0; i < 30; i++) {
 const sx = ((i * 137) % W);
 const sy = ((i * 53) % (H / 2 + 40));
 const twinkle = Math.sin(frame * 0.04 + i * 0.7) * 0.35 + 0.65;
 const alpha = twinkle * pal.starA;
 ctx.fillStyle = `rgba(255,255,255,${alpha})`;
 ctx.fillRect(sx, sy, 2, 2);
 }
 }

 // Moon
 if (pal.moon) {
 const mx = W - 75, my = 45;
 drawPixelRect(mx, my, 26, 26, '#e8e4d8');
 drawPixelRect(mx + 4, my + 3, 5, 5, '#d0ccc0');
 drawPixelRect(mx + 14, my + 10, 4, 4, '#d0ccc0');
 // Moon glow
 ctx.fillStyle = 'rgba(232,228,216,0.06)';
 ctx.fillRect(mx - 8, my - 8, 42, 42);
 }

 // Sun with arc movement
 if (pal.sun) {
 const sunProgress = (bgCycle * 4) % 4;
 let sunAngle;
 if (sunProgress < 1) sunAngle = 0.2 + sunProgress * 0.3; // dawn rising
 else if (sunProgress < 2) sunAngle = 0.5 + (sunProgress - 1) * 0.4; // day high
 else if (sunProgress < 3) sunAngle = 0.9 + (sunProgress - 2) * 0.3; // sunset
 else sunAngle = 1.2 + (sunProgress - 3) * 0.2; // night hiding
 const sunX = W - 100 + Math.cos(sunAngle) * 30;
 const sunY = 30 + Math.sin(sunAngle) * 25;
 const sunColor = pal.phase === 3 ? '#ff8844' : (pal.phase === 1 ? '#ffcc55' : '#ffee88');
 // Glow
 ctx.fillStyle = sunColor;
 ctx.globalAlpha = 0.08;
 ctx.fillRect(sunX - 15, sunY - 15, 56, 56);
 ctx.globalAlpha = 0.15;
 ctx.fillRect(sunX - 8, sunY - 8, 42, 42);
 ctx.globalAlpha = 1;
 // Sun body
 drawPixelRect(sunX, sunY, 26, 26, sunColor);
 // Rays
 ctx.fillStyle = sunColor;
 for (let i = 0; i < 12; i++) {
 const angle = frame * 0.008 + i * 0.524;
 const rx = sunX + 13 + Math.cos(angle) * 22;
 const ry = sunY + 13 + Math.sin(angle) * 22;
 ctx.globalAlpha = 0.12 + Math.sin(frame * 0.03 + i) * 0.06;
 ctx.fillRect(rx - 1, ry - 1, 3, 3);
 }
 ctx.globalAlpha = 1;
 }

 // Clouds
 for (const c of clouds) {
 const cloudColor = pal.phase === 2 ? 'rgba(255,255,255,0.22)' : pal.phase === 3 ? 'rgba(255,180,120,0.14)' : 'rgba(220,218,210,0.09)';
 drawPixelRect(c.x, c.y, c.w, c.h, cloudColor);
 drawPixelRect(c.x + 12, c.y - 4, c.w - 24, c.h, cloudColor.replace(/[0-9.]+\)$/, '0.05)'));
 }

 // Planes
 for (const p of planes) {
 const pc = pal.phase === 2 ? '#555' : '#999';
 drawPixelRect(p.x, p.y, 22, 3, pc);
 drawPixelRect(p.x + 7, p.y - 3, 8, 9, pc);
 drawPixelRect(p.x + 18, p.y - 3, 3, 5, pc);
 if (frame % 50 < 25) drawPixelRect(p.x + 20, p.y - 1, 2, 2, '#ff3333');
 }

 // City skyline
 const cityColor = pal.phase === 2 ? '#1a1a2e' : '#080810';
 const buildings = [
 [0, 28], [55, 42], [95, 22], [140, 35], [185, 18],
 [220, 30], [265, 24], [310, 38], [360, 20], [405, 32],
 [450, 26], [495, 40], [540, 22], [585, 34], [625, 28]
 ];
 for (const [bx, bh] of buildings) {
 drawPixelRect(bx, H - bh, 35, bh, cityColor);
 }
 // Windows — drawn per-building so they don't bleed
 ctx.fillStyle = pal.win;
 for (const [bx, bh] of buildings) {
 for (let wx = bx + 4; wx < bx + 31; wx += 7) {
 for (let wy = H - bh + 5; wy < H - 4; wy += 9) {
 if ((wx * 7 + wy * 3 + bx) % 13 < 6) ctx.fillRect(wx, wy, 3, 4);
 }
 }
 }
 }

 function drawUFO() {
 const ux = ufoEvent.x;
 const uy = ufoEvent.y;
 ufoEvent.rot += 0.03;

 // Beam with animated particles
 if (ufoEvent.beamAlpha > 0) {
 const bAlpha = ufoEvent.beamAlpha;
 // Main beam cone
 ctx.fillStyle = `rgba(100, 255, 80, ${bAlpha * 0.18})`;
 ctx.beginPath();
 ctx.moveTo(ux + 15, uy + 14);
 ctx.lineTo(ux - 35, H - 30);
 ctx.lineTo(ux + 65, H - 30);
 ctx.closePath();
 ctx.fill();
 // Inner beam
 ctx.fillStyle = `rgba(140, 255, 120, ${bAlpha * 0.12})`;
 ctx.beginPath();
 ctx.moveTo(ux + 15, uy + 14);
 ctx.lineTo(ux - 15, H - 30);
 ctx.lineTo(ux + 45, H - 30);
 ctx.closePath();
 ctx.fill();
 // Beam border
 ctx.strokeStyle = `rgba(120, 255, 80, ${bAlpha * 0.45})`;
 ctx.lineWidth = 1;
 ctx.beginPath();
 ctx.moveTo(ux + 15, uy + 14);
 ctx.lineTo(ux - 35, H - 30);
 ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(ux + 15, uy + 14);
 ctx.lineTo(ux + 65, H - 30);
 ctx.stroke();

 // Floating particles in beam
 for (let i = 0; i < 8; i++) {
 const py = uy + 20 + (frame * 2 + i * 40) % (H - uy - 50);
 const px = ux + 15 + Math.sin(frame * 0.05 + i * 0.8) * (py - uy) * 0.4;
 const ps = 1 + Math.sin(frame * 0.1 + i) * 0.5;
 ctx.fillStyle = `rgba(150, 255, 100, ${bAlpha * 0.6})`;
 ctx.fillRect(px, py, ps, ps);
 }
 }

 // UFO shadow / glow underneath
 ctx.fillStyle = 'rgba(100,255,80,0.08)';
 ctx.fillRect(ux - 10, uy + 12, 80, 6);

 // UFO saucer (rotating disc effect via offset lights)
 drawPixelRect(ux, uy, 60, 14, '#5a5a5a');
 drawPixelRect(ux + 2, uy + 2, 56, 10, '#707070');
 // Dome
 drawPixelRect(ux + 16, uy - 9, 28, 12, '#b0d0e0');
 drawPixelRect(ux + 20, uy - 7, 20, 8, '#c8e4f0');
 // Dome reflection
 drawPixelRect(ux + 22, uy - 5, 6, 3, '#ffffff');

 // Ring lights (animated chase)
 const lightColors = ['#ff3333', '#ff9933', '#ffff33', '#33ff33', '#33ffff', '#ff33ff'];
 for (let i = 0; i < 6; i++) {
 const offset = Math.floor(frame * 0.12) % 6;
 const on = (i + offset) % 6 < 3;
 const lx = ux + 5 + i * 9;
 drawPixelRect(lx, uy + 3, 6, 6, on ? lightColors[i] : '#444');
 if (on) {
 ctx.fillStyle = lightColors[i] + '22';
 ctx.fillRect(lx - 2, uy + 1, 10, 10);
 }
 }

 // Antenna
 drawPixelRect(ux + 14, uy - 13, 2, 5, '#888');
 drawPixelRect(ux + 13, uy - 15, 4, 3, '#ff3333');
 if (frame % 20 < 10) {
 ctx.fillStyle = 'rgba(255,50,50,0.3)';
 ctx.fillRect(ux + 10, uy - 18, 10, 10);
 }

 // Abductees (chained aliens rapping with animation)
 for (let i = 0; i < ufoEvent.abductees.length; i++) {
 const a = ufoEvent.abductees[i];
 const bob = Math.sin(frame * 0.08 + i * 1.5) * 2;
 const ax = a.x + Math.sin(frame * 0.05 + i) * 1.5;
 const ay = a.y + bob;

 // Body (classic grey alien shape)
 drawPixelRect(ax, ay, 10, 10, a.color);
 drawPixelRect(ax + 1, ay - 2, 8, 3, a.color); // head bulge
 // Big black eyes
 drawPixelRect(ax + 1, ay + 2, 3, 3, '#000');
 drawPixelRect(ax + 6, ay + 2, 3, 3, '#000');
 // Eye shine
 drawPixelRect(ax + 2, ay + 3, 1, 1, '#fff');
 drawPixelRect(ax + 7, ay + 3, 1, 1, '#fff');
 // Mouth (rapping — open/closed)
 if (Math.floor(frame * 0.1 + i) % 4 < 2) {
 drawPixelRect(ax + 4, ay + 6, 2, 1, '#000');
 }
 // Chain
 drawPixelRect(ax + 2, ay + 10, 6, 2, '#a0a0a0');
 // Mic in hand
 const micX = ax + (i % 2 === 0 ? -3 : 10);
 drawPixelRect(micX, ay + 4, 2, 5, '#333');
 drawPixelRect(micX - 1, ay + 2, 4, 3, '#666');

 // 420 text
 ctx.font = 'bold 10px "DM Mono", monospace';
 ctx.fillStyle = '#33ff33';
 ctx.textAlign = 'center';

 ctx.shadowBlur = 4;

 ctx.shadowBlur = 0;

 function drawPoliceLights() {
 const flashSpeed = 8;
 const isRed = Math.floor(frame / flashSpeed) % 2 === 0;
 // Top bar lights
 for (let i = 0; i < 6; i++) {
 const lx = 60 + i * 90;

 function drawDialog() {
 if (!activeDialog) return;
 const { text, x, y } = activeDialog;
 const px = x;
 const py = y - 28;

 ctx.font = 'bold 11px "DM Mono", monospace';
 ctx.textAlign = 'center';
 const metrics = ctx.measureText(text);
 const pad = 8;
 const bw = metrics.width + pad * 2;
 const bh = 20;
 const bx = px - bw / 2;
 const by = py - bh / 2;

 // Bubble background
 ctx.fillStyle = 'rgba(255,255,255,0.92)';
 ctx.fillRect(bx, by, bw, bh);
 ctx.strokeStyle = '#151515';
 ctx.lineWidth = 1;
 ctx.strokeRect(bx, by, bw, bh);

 // Little tail
 ctx.fillStyle = 'rgba(255,255,255,0.92)';
 ctx.beginPath();
 ctx.moveTo(px - 3, by + bh);
 ctx.lineTo(px + 3, by + bh);
 ctx.lineTo(px, by + bh + 4);
 ctx.closePath();
 ctx.fill();
 ctx.strokeStyle = '#151515';
 ctx.beginPath();
 ctx.moveTo(px - 3, by + bh);
 ctx.lineTo(px, by + bh + 4);
 ctx.lineTo(px + 3, by + bh);
 ctx.stroke();

 // Text
 ctx.fillStyle = '#151515';
 ctx.fillText(text, px, py + 1);
 }

 function spawnItem() {
 const r = Math.random();
 let acc = 0, type = itemTypes[0];
 for (const t of itemTypes) {
 acc += t.chance;
 if (r <= acc) { type = t; break; }
 }
 items.push({ x: 30 + Math.random() * (W - 60), y: -25, type: type, vy: type.speed * speedMult + Math.random() * 0.2 });
 }

 function addParticles(x, y, color) {
 for (let i = 0; i < 10; i++) {
 particles.push({ x, y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5 - 3, size: 2 + Math.random() * 4, color, life: 40 });
 }
 }

 function triggerDialog(trigger) {
 if (activeDialog && activeDialog.timer > 0) return;
 const lines = selectedChar === 'male' ? maleLines : animeLines;
 let text = '';
 if (trigger === 'diamond') {
 text = selectedChar === 'male' ? "that's right" : "uwu";
 } else if (trigger === 'milestone') {
 text = lines[Math.floor(Math.random() * lines.length)];
 }
 if (text) {
 activeDialog = {
 text,
 timer: 90,
 x: player.x + player.w / 2,
 y: player.y
 };
 }
 }

 function triggerBusted() {
 busted = true;
 bustedFrame = 0;
 copY = -60;
 items = [];
 activeDialog = null;
 }

 function update(dt) {
 if (activeDialog) {
 activeDialog.timer -= dt;
 activeDialog.x = player.x + player.w / 2;
 activeDialog.y = player.y;
 if (activeDialog.timer <= 0) activeDialog = null;
 }

 if (busted) {
 bustedFrame += dt;
 // Shake effect
 shakeX = Math.sin(bustedFrame * 0.8) * 3;
 shakeY = Math.cos(bustedFrame * 0.6) * 2;
 // Cop descends
 if (copY < player.y - 20) copY += 2.5 * dt;
 else {
 // Cop caught player - end game
 if (bustedFrame > 120) {
 endGame(true);
 return;
 }
 }
 frame += dt;
 bgCycle += 0.0003 * dt;
 return;
 }

 if (keys.left) player.x -= player.speed * dt;
 if (keys.right) player.x += player.speed * dt;
 player.x = Math.max(0, Math.min(W - player.w, player.x));

 // Background cycle - very smooth
 bgCycle += 0.00025 * dt;

 // Clouds
 for (const c of clouds) {
 c.x += c.speed * dt;
 if (c.x > W + 60) { c.x = -c.w - 20; c.y = 15 + Math.random() * (H / 3); }
 }
 // Planes
 for (const p of planes) {
 p.x += p.speed * dt;
 if (p.x > W + 50) { p.x = -80 - Math.random() * 150; p.y = 25 + Math.random() * 70; }
 }

 // Check busted condition at 30 seconds
 if (timeLeft === 30 && score < 300 && !busted) {
 triggerBusted();
 return;
 }

 // UFO 420 event trigger
 if (score >= 420 && !ufoEvent.triggered && !busted) {
 ufoEvent.triggered = true;
 ufoEvent.active = true;
 ufoEvent.timer = 300; // 5 seconds @ 60fps base
 ufoEvent.x = W / 2 - 30;
 ufoEvent.y = -50;
 ufoEvent.beamAlpha = 0;
 // Create abductee aliens
 ufoEvent.abductees = [];
 for (let i = 0; i < 4; i++) {
 ufoEvent.abductees.push({
 x: player.x + (Math.random() - 0.5) * 60,
 y: player.y + 10,
 vy: -1.5 - Math.random(),
 w: 10, h: 10,
 color: i % 2 === 0 ? '#7ec850' : '#c8e850'
 });
 }
 }

 frame += dt;
 spawnAccumulator += dt;
 if (!busted && spawnAccumulator >= spawnRate) {
 spawnAccumulator = 0;
 spawnItem();
 }
 // Every ~8 seconds increase difficulty, cap speedMult at 2.5x
 if (frame > 0 && Math.floor(frame / 480) > Math.floor((frame - dt) / 480)) {
 spawnRate = Math.max(18, spawnRate - 3);
 speedMult = Math.min(2.5, speedMult + 0.06);
 }

 for (let i = items.length - 1; i >= 0; i--) {
 const it = items[i];
 it.y += it.vy * dt;
 it.x += Math.sin(frame * 0.025 + i) * 0.3 * dt;
 if (it.x > player.x + 4 && it.x < player.x + player.w - 4 && it.y > player.y + 8 && it.y < player.y + player.h) {
 score += it.type.score;
 scoreEl.textContent = score;
 addParticles(it.x, it.y, it.type.color);
 playPickupSound(it.type.text);

 if (it.type.text === '\uD83D\uDC8E') triggerDialog('diamond');
 const milestone = Math.floor(score / 100) * 100;
 if (milestone > lastMilestone && milestone >= 100) {
 triggerDialog('milestone');
 lastMilestone = milestone;
 }

 items.splice(i, 1);
 continue;
 }
 if (it.y > H + 20) {
 if (overtime) {
 missedItems++;
 if (missedItems >= MISSES_PER_LIFE) {
 missedItems = 0;
 lives--;
 playLifeLostSound();
 if (livesEl) livesEl.textContent = '♥'.repeat(Math.max(0, lives));
 if (lives <= 0) { endGame(false); return; }
 }
 }
 items.splice(i, 1);
 }
 }

 // UFO event update
 if (ufoEvent.active) {
 ufoEvent.timer -= dt;
 // UFO descends
 if (ufoEvent.y < 45) ufoEvent.y += 1.2 * dt;
 else ufoEvent.beamAlpha = Math.min(ufoEvent.beamAlpha + 0.04 * dt, 0.55);

 // Abductees float up into beam
 for (const a of ufoEvent.abductees) {
 a.y += a.vy * dt;
 a.x += Math.sin(frame * 0.08 + a.y * 0.05) * 0.4 * dt;
 }

 // Auto-collect ALL items in the beam zone (full width under UFO)
 const beamLeft = ufoEvent.x - 40;
 const beamRight = ufoEvent.x + 100;
 for (let i = items.length - 1; i >= 0; i--) {
 const it = items[i];
 if (it.x > beamLeft && it.x < beamRight) {
 score += it.type.score;
 scoreEl.textContent = score;
 addParticles(it.x, it.y, it.type.color);
 items.splice(i, 1);
 }
 }

 if (ufoEvent.timer <= 0) {
 ufoEvent.active = false;
 ufoEvent.abductees = [];
 }
 }

 for (let i = particles.length - 1; i >= 0; i--) {
 const p = particles[i];
 p.x += p.vx * dt; p.y += p.vy * dt;
 p.vy += 0.12 * dt;
 p.life -= dt;
 if (p.life <= 0) particles.splice(i, 1);
 }
 }

 function draw() {
 ctx.save();
 if (busted) {
 ctx.translate(shakeX, shakeY);
 }
 ctx.clearRect(-10, -10, W + 20, H + 20);
 drawSky();
 if (ufoEvent.active) drawUFO();
 for (const it of items) drawItem(it);
 if (selectedChar === 'male') drawPlayer();
 else drawAnimeGirl();
 if (busted) {
 drawPoliceLights();
 drawCop();
 // BUSTED text
 if (bustedFrame > 40) {
 ctx.font = 'bold 42px "Instrument Serif", Georgia, serif';
 ctx.textAlign = 'center';
 ctx.fillStyle = '#ff0000';
 ctx.fillText('BUSTED', W / 2, H / 2 - 30);
 ctx.font = '14px "DM Mono", monospace';
 ctx.fillStyle = '#ff6666';
 ctx.fillText('not enough points...', W / 2, H / 2 + 10);
 }
 }
 drawDialog();
 drawParticles();
 ctx.restore();
 }

 function loop(timestamp) {
 if (!running) return;
 if (!lastTime) lastTime = timestamp;
 const rawDt = timestamp - lastTime;
 lastTime = timestamp;
 // Cap dt to avoid huge jumps when tab regains focus
 const dt = Math.min(rawDt / TARGET_DT, 3);
 update(dt);
 draw();
 animId = requestAnimationFrame(loop);
 }

 function startGame() {
 score = 0; timeLeft = 60; frame = 0; bgCycle = 0; lastTime = 0;
 items = []; particles = []; busted = false; bustedFrame = 0; copY = -60;
 spawnRate = 42; speedMult = 1.0; activeDialog = null; lastMilestone = 0;
 spawnAccumulator = 0;
 lives = MAX_LIVES; missedItems = 0; overtime = false;
 ufoEvent = { active: false, triggered: false, timer: 0, x: -80, y: -50, beamAlpha: 0, abductees: [], rot: 0, beamParticles: [] };
 player.x = W / 2 - 20;
 scoreEl.textContent = '0';
 timerEl.textContent = '60';
 if (livesEl) livesEl.textContent = '♥'.repeat(MAX_LIVES);
 startOverlay.classList.add('hidden');
 overOverlay.classList.add('hidden');
 if (overtimeOverlay) overtimeOverlay.classList.add('hidden');
 running = true;
 startMusic(selectedChar === 'male' ? 'male' : 'anime');
 animId = requestAnimationFrame(loop);
 timerId = setInterval(() => {
 if (busted || overtime) return;
 timeLeft--;
 timerEl.textContent = timeLeft;
 if (timeLeft <= 0) {
 if (score >= 1000) triggerOvertime();
 else endGame(false);
 }
 }, 1000);
 }

 function triggerOvertime() {
 overtime = true;
 timeLeft = 0;
 timerEl.textContent = 'OT';
 if (overtimeOverlay) {
 overtimeOverlay.classList.remove('hidden');
 setTimeout(() => overtimeOverlay.classList.add('hidden'), 2500);
 }
 playOvertimeSound();
 }

 function endGame(isBusted) {
 running = false;
 cancelAnimationFrame(animId);
 clearInterval(timerId);
 if (isBusted) {
 finalScoreEl.innerHTML = 'BUSTED<br>score: ' + score + '';
 } else if (overtime && lives <= 0) {
 finalScoreEl.innerHTML = 'OVERTIME OVER<br>score: ' + score + '';
 } else {
 finalScoreEl.textContent = 'score: ' + score;
 }
 overOverlay.classList.remove('hidden');
 const prev = parseInt(localStorage.getItem('pls_highscore') || '0');
 if (score > prev) localStorage.setItem('pls_highscore', String(score));
 startMusic('menu');
 }

 function onKey(e, pressed) {
 if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = pressed;
 if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = pressed;
 // Spacebar intentionally disabled — use character buttons to start
 }

 const keyDown = (e) => onKey(e, true);
 const keyUp = (e) => onKey(e, false);
 document.addEventListener('keydown', keyDown);
 document.addEventListener('keyup', keyUp);

 if (leftBtn) {
 const pressL = (e) => { e.preventDefault(); keys.left = true; };
 const relL = (e) => { e.preventDefault(); keys.left = false; };
 leftBtn.addEventListener('mousedown', pressL);
 leftBtn.addEventListener('mouseup', relL);
 leftBtn.addEventListener('mouseleave', relL);
 leftBtn.addEventListener('touchstart', pressL, { passive: false });
 leftBtn.addEventListener('touchend', relL);
 }
 if (rightBtn) {
 const pressR = (e) => { e.preventDefault(); keys.right = true; };
 const relR = (e) => { e.preventDefault(); keys.right = false; };
 rightBtn.addEventListener('mousedown', pressR);
 rightBtn.addEventListener('mouseup', relR);
 rightBtn.addEventListener('mouseleave', relR);
 rightBtn.addEventListener('touchstart', pressR, { passive: false });
 rightBtn.addEventListener('touchend', relR);
 }

 // Character selection
 const charBtns = startOverlay.querySelectorAll('.char-btn');
 charBtns.forEach(btn => {
 btn.addEventListener('click', () => {
 selectedChar = btn.dataset.char;
 startGame();
 });
 });

 restartBtn.addEventListener('click', () => {
 startOverlay.classList.remove('hidden');
 overOverlay.classList.add('hidden');
 if (overtimeOverlay) overtimeOverlay.classList.add('hidden');
 running = false;
 cancelAnimationFrame(animId);
 clearInterval(timerId);
 startMusic('menu');
 drawSky();
 if (selectedChar === 'male') drawPlayer();
 else drawAnimeGirl();
 });

 dialog.addEventListener('close', () => {
 running = false;
 cancelAnimationFrame(animId);
 clearInterval(timerId);
 document.removeEventListener('keydown', keyDown);
 document.removeEventListener('keyup', keyUp);
 startMusic('menu');
 ufoEvent = { active: false, triggered: false, timer: 0, x: -80, y: -50, beamAlpha: 0, abductees: [], rot: 0, beamParticles: [] };
 }, { once: true });

 drawSky();
 drawPlayer();
}</script>
  </body>
