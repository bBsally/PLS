<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PL$ — Audio Plugin</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="assets/pls-logo.png">
</head>
<body>
<div class="desktop">
  <header class="topbar">
    <a href="/" class="wordmark">PL<span>$</span></a>
    <p>audio tools</p>
    <button class="sound-toggle" aria-pressed="false" aria-label="Toggle sound">sound: off</button>
  </header>

  <section class="hero">
    <p class="eyebrow reveal-text">audio plugin</p>
    <h1 class="reveal-hero">
      <span class="word">PL<span>$</span></span>
      <small class="reveal-delay">v0.9 beta</small>
    </h1>
    <p class="intro reveal-text">Designed to fit anywhere in your workflow. From vocals and drums to synths, samples and entire mixes — PL$ gives every sound more depth, character and life.</p>
    <p class="status reveal-text"><i></i><span>currently in development</span></p>
  </section>

  <div class="folder-field">
    <button class="folder folder-plugin" data-panel="plugin" style="--delay:0.1s">
      <span class="folder-icon">PL</span>
      <span class="folder-body"><b>Plugin</b><small>overview</small></span>
    </button>
    <button class="folder folder-about" data-panel="about" style="--delay:0.2s">
      <span class="folder-icon">Ab</span>
      <span class="folder-body"><b>About</b><small>the story</small></span>
    </button>
    <button class="folder folder-tools" data-panel="tools" style="--delay:0.3s">
      <span class="folder-icon">To</span>
      <span class="folder-body"><b>Tools</b><small>specs</small></span>
    </button>
    <button class="folder folder-store" data-panel="store" style="--delay:0.35s">
      <span class="folder-icon">St</span>
      <span class="folder-body"><b>Store</b><small>buy PL$</small></span>
    </button>
    <button class="folder folder-contact" data-panel="contact" style="--delay:0.4s">
      <span class="folder-icon">Ct</span>
      <span class="folder-body"><b>Contact</b><small>reach out</small></span>
    </button>
  </div>

  <footer class="footer">
    <span>PL$ © 2026</span>
    <span>built independently in Poland</span>
    <span>v0.9 beta</span>
  </footer>
</div>

<dialog id="panel" class="panel">
  <div class="panel-head">
    <p>PL$</p>
    <button class="close" aria-label="Close">×</button>
  </div>
  <div id="panel-content" class="panel-content"></div>
</dialog>

<template id="plugin-template">
  <div class="plugin-view">
    <div class="plugin-title">
      <h2>PL$</h2>
      <p class="eyebrow">audio plugin</p>
      <p class="muted">v0.9 beta · VST3 / AU / AAX</p>
    </div>
    <div class="plugin-image">
      <img src="assets/pls-ui-mockup.jpg" alt="PL$ plugin interface mockup" loading="lazy">
    </div>
    <div class="panel-copy">
      <p>PL$ is a character processor built for producers who want their sound to feel less perfect and more personal. It combines harmonic saturation, transient shaping, and spectral texture into a single, intuitive interface.</p>
      <ul>
        <li>Harmonic drive with 4 saturation models</li>
        <li>Transient shaper with attack / sustain</li>
        <li>Spectral texture — add grain, air, or dirt</li>
        <li>Mix knob for parallel processing</li>
        <li>Low CPU usage, zero latency</li>
      </ul>
    </div>
    <a href="#" class="outline-button" data-soon>Join the beta →</a>
  </div>
</template>

<template id="about-template">
  <div class="text-view about-view">
    <p class="eyebrow">about</p>
    <h2>Built by hand.<small>PL$ is an independent project created by a young producer from Poland. No investors. No corporate roadmap. Just a tool made for people who care about how their music feels.</small></h2>
    <p>The idea was simple: most plugins try to make audio "better." PL$ tries to make it <em>yours</em>. Less sterile. More alive. Less polished. More human.</p>
    <p class="muted">If that resonates with you, stick around.</p>
  </div>
</template>

<template id="tools-template">
  <div class="text-view">
    <p class="eyebrow">tools & specs</p>
    <h2>Tech</h2>
    <div class="tool-list">
      <p><span>Formats</span> <em>VST3 · AU · AAX</em></p>
      <p><span>OS</span> <em>macOS 11+ · Windows 10+</em></p>
      <p><span>Sample rates</span> <em>44.1 – 192 kHz</em></p>
      <p><span>Latency</span> <em>Zero</em></p>
      <p><span>CPU</span> <em>~1.2% per instance @ 48k</em></p>
      <p><span>Authorization</span> <em>License file — no dongle</em></p>
    </div>
    <p class="muted">More detailed documentation will be available with the v1.0 release.</p>
  </div>
</template>

<template id="store-template">
  <div class="text-view store-view">
    <p class="eyebrow">store</p>
    <h2>Coming Soon</h2>
    <p>PL$ is still in active development. The store will open once v1.0 is ready for release.</p>
    <div class="soon-box">
      <p class="soon-label">Expected release</p>
      <p class="soon-date">Q4 2026</p>
      <p class="soon-note">Sign up below to get notified when PL$ drops — early supporters get a discount.</p>
    </div>
    <form class="beta-form" action="/api/beta" method="POST">
      <label>
        Notify me at launch
        <span>Enter your e-mail to join the waitlist.</span>
      </label>
      <div>
        <input type="email" name="email" placeholder="your@email.com" required>
        <button type="submit">Notify me</button>
      </div>
      <p class="form-status"></p>
    </form>
  </div>
</template>

<template id="contact-template">
  <div class="text-view contact-view">
    <p class="eyebrow">contact</p>
    <h2>Let's talk.</h2>
    <p>Questions, feedback, or just want to say hi? Reach out.</p>
    <a href="mailto:bbsally389@gmail.com">bbsally389@gmail.com</a>
    <a href="https://instagram.com/plsaudio" target="_blank" rel="noopener">instagram → @plsaudio</a>
    <p class="muted" style="margin-top:35px">For beta access, use the form in the Plugin folder.</p>
  </div>
</template>

<script src="script.js"></script>
</body>
</html>
